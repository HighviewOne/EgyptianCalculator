<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egyptian Calculator</title>
  <meta name="description" content="A calculator draped in the gold of ancient Egypt that shows every answer in hieroglyphic numerals." />
  <meta name="theme-color" content="#140b04" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Link previews (Open Graph / Twitter); the image needs an absolute URL -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calculator of the Pharaohs" />
  <meta property="og:description" content="A calculator draped in the gold of ancient Egypt that shows every answer in hieroglyphic numerals." />
  <meta property="og:url" content="https://highviewone.github.io/EgyptianCalculator/" />
  <meta property="og:image" content="https://highviewone.github.io/EgyptianCalculator/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Egyptian Calculator showing a sum and its answer in hieroglyphs" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="papyrus-bg">
    <div class="stars" id="stars"></div>

    <header class="temple-header">
      <div class="eye-of-ra" aria-hidden="true">𓂀</div>
      <h1><span aria-hidden="true">𓂀 </span>Calculator of the Pharaohs<span aria-hidden="true"> 𓂀</span></h1>
      <div class="hieroglyph-strip" aria-hidden="true">𓀀 𓁿 𓂋 𓆣 𓇋 𓈖 𓉐 𓊪 𓋹 𓌀 𓍿 𓎛 𓏏 𓐍</div>
    </header>

    <div class="calculator-wrapper">
      <div class="pillar left-pillar" aria-hidden="true">
        <div class="cartouche">𓏞</div>
        <div class="pillar-body"></div>
        <div class="cartouche">𓏜</div>
      </div>

      <div class="calculator">
        <div class="display-area" role="status" aria-live="polite">
          <div class="display-expression" id="expression">0</div>
          <div class="display-result" id="result"></div>
          <div class="display-hieroglyph" id="hieroglyph-num" aria-hidden="true"></div>
          <div class="display-hieroglyph-note" id="hieroglyph-note"></div>
        </div>

        <div class="mode-row">
          <button class="mode-toggle" id="fraction-toggle" data-action="fractions"
                  aria-pressed="false" title="Show fractions as Egyptian unit fractions (F)">
            <span aria-hidden="true">𓂋 </span>Unit fractions
          </button>
        </div>

        <div class="button-grid">
          <!-- Row 1 -->
          <button class="btn btn-fn" data-action="clear" aria-label="All clear">AC</button>
          <button class="btn btn-fn" data-action="sign" aria-label="Toggle sign">+/−</button>
          <button class="btn btn-fn" data-action="percent" aria-label="Percent">%</button>
          <button class="btn btn-op" data-op="÷" aria-label="Divide">𓌀 ÷</button>

          <!-- Row 2 -->
          <button class="btn btn-num" data-digit="7">7</button>
          <button class="btn btn-num" data-digit="8">8</button>
          <button class="btn btn-num" data-digit="9">9</button>
          <button class="btn btn-op" data-op="×" aria-label="Multiply">× 𓆣</button>

          <!-- Row 3 -->
          <button class="btn btn-num" data-digit="4">4</button>
          <button class="btn btn-num" data-digit="5">5</button>
          <button class="btn btn-num" data-digit="6">6</button>
          <button class="btn btn-op" data-op="−" aria-label="Subtract">− 𓏏</button>

          <!-- Row 4 -->
          <button class="btn btn-num" data-digit="1">1</button>
          <button class="btn btn-num" data-digit="2">2</button>
          <button class="btn btn-num" data-digit="3">3</button>
          <button class="btn btn-op" data-op="+" aria-label="Add">𓇋 +</button>

          <!-- Row 5 -->
          <button class="btn btn-num btn-zero" data-digit="0">0</button>
          <button class="btn btn-num" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="btn btn-equals" data-action="equals" aria-label="Equals">𓋹 =</button>
        </div>
      </div>

      <div class="pillar right-pillar" aria-hidden="true">
        <div class="cartouche">𓏞</div>
        <div class="pillar-body"></div>
        <div class="cartouche">𓏜</div>
      </div>
    </div>

    <footer class="temple-footer">
      <div class="scarab" aria-hidden="true">𓆣</div>
      <p>Built in the age of Pharaohs &bull; Numbers preserved on papyrus</p>
      <div class="hieroglyph-strip" aria-hidden="true">𓐍 𓏏 𓎛 𓍿 𓌀 𓋹 𓊪 𓉐 𓈖 𓇋 𓆣 𓂋 𓁿 𓀀</div>
    </footer>
  </div>

  <script src="calc-core.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
